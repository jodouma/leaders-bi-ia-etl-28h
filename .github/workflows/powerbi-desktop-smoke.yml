name: Essai natif Power BI Desktop (limité)
on:
  push:
    branches: [cours-codex-bi-15h]
    paths:
      - 'powerbi/**'
      - '.github/scripts/powerbi_smoke.ps1'
      - '.github/workflows/powerbi-desktop-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construire un export réel dans un dossier neuf
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $atelier = Join-Path $env:RUNNER_TEMP 'atlas-reference'
          python outils/jalon.py 07 $atelier
          Push-Location $atelier
          try {
            python executer.py initial
            python executer.py increment
            python executer.py export
          } finally { Pop-Location }
          $livraison = Get-ChildItem (Join-Path $atelier 'outputs/powerbi') -Directory | Sort-Object Name | Select-Object -Last 1
          if (-not $livraison) { throw 'Export absent' }
          Copy-Item powerbi (Join-Path $env:RUNNER_TEMP 'Atlas-PowerBI') -Recurse
          "ATLAS_CSV=$($livraison.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Installer, ouvrir et tenter une capture officielle
        shell: pwsh
        run: |
          .github/scripts/powerbi_smoke.ps1 -ProjectFolder (Join-Path $env:RUNNER_TEMP 'Atlas-PowerBI') -ExportFolder $env:ATLAS_CSV -EvidenceFolder (Join-Path $env:RUNNER_TEMP 'powerbi-evidence') -InstallDesktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: powerbi-desktop-evidence
          path: ${{ runner.temp }}/powerbi-evidence
          if-no-files-found: warn
