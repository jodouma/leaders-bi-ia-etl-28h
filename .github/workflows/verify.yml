name: Vérifier le parcours Atlas BI 15 h
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  student-route:
    name: Python 3.13 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Contrats qualité, SQL, SCD2, transactions et exports
        run: python -m unittest discover -s tests -v
      - name: Sept jalons neufs et séquence initial / incrément / rejeu / export
        run: python authoring/check_materials.py --runtime-only
  printed-materials:
    name: PDF et commandes Linux imprimées
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r authoring/requirements.txt
      - name: Exécuter les extraits des PDF distribués
        run: python authoring/check_materials.py
      # Native ETL execution does not establish WSL GUI, Codex Free account
      # availability or an interactive Power BI Desktop import/refresh.
